<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>BTC相互計算機</title>
    <style>
        [data-theme="light"] {
            --bg:         #f0f2f5;
            --card:       #ffffff;
            --border:     #ddd;
            --text:       #333;
            --muted:      #555;
            --info:       #888;
            --input-bg:   #ffffff;
            --reset-bg:   #eee;
            --reset-hover:#ddd;
            --reset-text: #666;
            --kanji:      #00a896;
            --focus:      #00c2b1;
        }

        [data-theme="dark"] {
            --bg:         #0d0f14;
            --card:       #161a24;
            --border:     #2a3045;
            --text:       #e8eaf0;
            --muted:      #a0aabe;
            --info:       #6b7280;
            --input-bg:   #1e2433;
            --reset-bg:   #232838;
            --reset-hover:#2e3550;
            --reset-text: #a0aabe;
            --kanji:      #3ecf8e;
            --focus:      #5b7cfa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
            background-color: var(--bg);
            min-height: 100vh;
            transition: background-color 0.25s, color 0.25s;
        }

        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 400px;
            height: fit-content;
            transition: background 0.25s, box-shadow 0.25s;
        }

        [data-theme="dark"] .card {
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        h2 { color: var(--text); font-size: 1.2rem; }

        #theme-btn {
            background: var(--reset-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--reset-text);
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            white-space: nowrap;
        }

        #theme-btn:hover {
            background: var(--reset-hover);
            border-color: var(--focus);
            color: var(--focus);
        }

        .input-group { margin-bottom: 1.2rem; position: relative; }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s, background 0.25s, color 0.25s;
            text-align: right;
        }

        input:focus { border-color: var(--focus); }
        input::placeholder { color: var(--info); }

        .kanji-hint {
            font-size: 0.82rem;
            color: var(--kanji);
            margin-top: 4px;
            min-height: 1.2em;
            font-weight: bold;
            letter-spacing: 0.03em;
            transition: color 0.25s;
        }

        .info { font-size: 0.75rem; color: var(--info); margin-top: 10px; line-height: 1.4; }

        .reset-btn {
            width: 100%;
            background: var(--reset-bg);
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            color: var(--reset-text);
            transition: background 0.2s, color 0.2s;
        }

        .reset-btn:hover { background: var(--reset-hover); }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>BTC 相互計算機</h2>
        <button id="theme-btn" onclick="toggleTheme()">
            <span id="theme-icon">🌙</span>
            <span id="theme-label">ダークモード</span>
        </button>
    </div>

    <div class="input-group">
        <label>① 1BTCの価格 (円)</label>
        <input type="text" id="price" placeholder="例: 10,000,000" oninput="handleInput('price')">
        <div class="kanji-hint" id="price-kanji"></div>
    </div>

    <div class="input-group">
        <label>② 保有量 (BTC)</label>
        <input type="text" id="amount" placeholder="例: 0.3" oninput="handleInput('amount')">
    </div>

    <div class="input-group">
        <label>③ 現在の評価額 (円)</label>
        <input type="text" id="total" placeholder="例: 3,000,000" oninput="handleInput('total')">
        <div class="kanji-hint" id="total-kanji"></div>
    </div>

    <button class="reset-btn" onclick="resetAll()">クリア</button>

    <div class="info">
        ※数値を入力すると自動でカンマが入ります。<br>
        ※2つの欄を入力すると、残りの1つを自動計算します。
    </div>
</div>

<script>
    const STORAGE_KEY = 'btc-simple-theme';

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const isDark = theme === 'dark';
        document.getElementById('theme-icon').textContent  = isDark ? '☀️' : '🌙';
        document.getElementById('theme-label').textContent = isDark ? 'ライトモード' : 'ダークモード';
        localStorage.setItem(STORAGE_KEY, theme);
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    applyTheme(localStorage.getItem(STORAGE_KEY) || 'light');

    function toKanji(num) {
        if (!num || num <= 0) return "";
        const n   = Math.floor(num);
        const cho = Math.floor(n / 1_0000_0000_0000);
        const oku = Math.floor((n % 1_0000_0000_0000) / 1_0000_0000);
        const man = Math.floor((n % 1_0000_0000) / 1_0000);
        const en  = n % 1_0000;
        let result = "";
        if (cho) result += cho + "兆";
        if (oku) result += oku + "億";
        if (man) result += man + "万";
        if (en)  result += en;
        return result + "円";
    }

    function updateKanji(id) {
        const hintEl = document.getElementById(id + '-kanji');
        if (!hintEl) return;
        const val = parseNum(document.getElementById(id).value);
        hintEl.textContent = val > 0 ? toKanji(val) : "";
    }

    function parseNum(val) {
        const num = parseFloat(val.replace(/,/g, ''));
        return isNaN(num) ? 0 : num;
    }

    function formatNum(val, isBTC = false) {
        if (!val && val !== 0) return "";
        if (isBTC) return val.toFixed(8).replace(/\.?0+$/, "");
        return Math.floor(val).toLocaleString();
    }

    function handleInput(currentId) {
        const activeEl = document.getElementById(currentId);
        const rawValue = activeEl.value.replace(/,/g, '');
        if (currentId !== 'amount') {
            if (rawValue) activeEl.value = Number(rawValue).toLocaleString();
        }
        calculate(currentId);
        updateKanji('price');
        updateKanji('total');
    }

    function calculate(currentId) {
        const p = document.getElementById('price');
        const a = document.getElementById('amount');
        const t = document.getElementById('total');
        const valP = parseNum(p.value);
        const valA = parseNum(a.value);
        const valT = parseNum(t.value);

        if (currentId === 'price' || currentId === 'amount') {
            if (valP && valA) t.value = formatNum(valP * valA);
        }
        if (currentId === 'total') {
            if (valT && valP)      a.value = formatNum(valT / valP, true);
            else if (valT && valA) p.value = formatNum(valT / valA);
        }
        if (currentId === 'amount' && valA && valT && !valP) {
            p.value = formatNum(valT / valA);
        }
    }

    function resetAll() {
        ['price', 'amount', 'total'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('price-kanji').textContent = "";
        document.getElementById('total-kanji').textContent = "";
    }
</script>

</body>
</html>
